<div class="layout">
  <!-- Sidebar -->
  <nav
    class="sidebar"
    [class.open]="mobileMenuOpen()"
  >
    <div class="sidebar-header">
      <div class="logo-container">
        <img src="logo.png" alt="Logo StokSaku ERP" class="logo-img" />
        <h1 class="logo-text">StokSaku ERP</h1>
      </div>
    </div>

    <ul class="nav-menu">
      @for (item of navItems; track item.path) {
        <li>
          <a
            routerLink="{{ item.path }}"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMobileMenu()"
          >
            <span class="icon">
              <app-icon [name]="item.icon" [size]="18" />
            </span>
            <span class="label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>

    <div class="sidebar-footer-brand">
      <div class="app-version">v{{ appVersion }}</div>
      <div class="app-copyright">© {{ currentYear }} StokSaku ERP</div>
    </div>
  </nav>

  <!-- Mobile overlay -->
  <div
    class="overlay"
    [class.show]="mobileMenuOpen()"
    (click)="closeMobileMenu()"
  ></div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Header -->
    <header class="header">
      <!-- Mobile & Tablet: Hamburger menu -->
      <button class="menu-btn" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="header-titles">
        <h2 class="page-title">{{ pageTitle() }}</h2>
        <span class="page-breadcrumb">StokSaku ERP / {{ pageTitle() }}</span>
      </div>

      <div class="header-actions">
        @if (auth.getActiveOrg()) {
          <div class="org-badge">
            <span class="org-dot"></span>
            <span class="org-slug-header">{{ auth.getActiveOrg() }}</span>
          </div>
        }
        <button class="logout-btn-header" (click)="openLogoutConfirm()" title="Keluar dari akun">
          <app-icon name="log-out" [size]="16" />
          <span class="btn-text">Keluar</span>
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="content" (click)="closeMobileMenu()">
      <router-outlet />
    </main>
  </div>

  <!-- Global Toast Notification Container -->
  <app-toast-container />

  <!-- Logout Confirmation Dialog -->
  <app-confirm-dialog
    [isOpen]="showLogoutConfirm()"
    title="Konfirmasi Keluar"
    message="Apakah Anda yakin ingin keluar dari sistem StokSaku ERP? Sesi login Anda akan diakhiri."
    confirmText="Ya, Keluar"
    cancelText="Batal"
    variant="danger"
    [loading]="logoutLoading()"
    (confirmed)="confirmLogout()"
    (cancelled)="cancelLogout()"
  ></app-confirm-dialog>
</div>

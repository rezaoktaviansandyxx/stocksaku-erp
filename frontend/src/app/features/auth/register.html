<div class="auth-container">
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
    <h2>Daftar ke StokSaku ERP</h2>

    <p *ngIf="error()" class="error">{{ error() }}</p>

    <label>
      Nama Lengkap
      <input type="text" formControlName="full_name" placeholder="John Doe" />
      <small *ngIf="f.full_name.invalid && f.full_name.touched">Nama diperlukan</small>
    </label>

    <label>
      Email
      <input
        type="email"
        formControlName="email"
        placeholder="email@example.com"
      />
      <small *ngIf="f.email.invalid && f.email.touched">Isi email yang valid</small>
    </label>

    <label>
      Password
      <input
        type="password"
        formControlName="password"
        placeholder="Minimal 8 karakter"
      />
      <small *ngIf="f.password.invalid && f.password.touched">
        Password minimal 8 karakter
      </small>
    </label>

    <button type="submit" [disabled]="registerForm.invalid || loading()">
      {{ loading() ? 'Memproses...' : 'Daftar' }}
    </button>

    <p class="switch-link">
      Sudah punya akun? <a routerLink="/login">Masuk</a>
    </p>
  </form>
</div>

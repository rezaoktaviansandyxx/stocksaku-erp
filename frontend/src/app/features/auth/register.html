<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img src="logo.png" alt="StokSaku ERP" class="brand-logo" />
      <h2>Daftar ke StokSaku ERP</h2>
      <p class="subtitle">Buat akun untuk mengelola stok bisnis Anda</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div *ngIf="error()" class="alert-error">
        <span>⚠️</span>
        <span>{{ error() }}</span>
      </div>

      <div class="form-group">
        <label for="fullName">Nama Lengkap</label>
        <input
          id="fullName"
          type="text"
          formControlName="full_name"
          placeholder="Contoh: Budi Santoso"
          autocomplete="name"
        />
        <small class="error-hint" *ngIf="f.full_name.invalid && f.full_name.touched">Nama diperlukan</small>
      </div>

      <div class="form-group">
        <label for="regEmail">Email</label>
        <input
          id="regEmail"
          type="email"
          formControlName="email"
          placeholder="nama@email.com"
          autocomplete="email"
        />
        <small class="error-hint" *ngIf="f.email.invalid && f.email.touched">Isi email yang valid</small>
      </div>

      <div class="form-group">
        <label for="regPassword">Password</label>
        <input
          id="regPassword"
          type="password"
          formControlName="password"
          placeholder="Minimal 8 karakter"
          autocomplete="new-password"
        />
        <small class="error-hint" *ngIf="f.password.invalid && f.password.touched">
          Password minimal 8 karakter
        </small>
      </div>

      <button type="submit" class="submit-btn" [disabled]="registerForm.invalid || loading()">
        {{ loading() ? 'Memproses...' : 'Daftar' }}
      </button>

      <p class="switch-link">
        Sudah punya akun? <a routerLink="/login">Masuk ke akun</a>
      </p>
    </form>
  </div>
</div>
